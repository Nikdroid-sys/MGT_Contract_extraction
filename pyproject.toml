[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "agentic-contract-ai"
version = "0.1.0"
description = "Enterprise-grade autonomous contract extraction using LangGraph and DeepEval."
authors = [{ name = "Nikhil Chaube", email = "nikhilchaube26@gmail.com" }]
# Python 3.12 is the 2026 stable standard for Render and enterprise AI
requires-python = ">=3.12"
dependencies = [
    # Core Web & API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.12",  # For file uploads
    "python-jose[cryptography]>=3.4.0", # Local JWT Auth
    "passlib[bcrypt]>=1.7.4",     # Password hashing

    # Agent Orchestration
    "langgraph>=1.1.2",           # Latest 2026 stable release
    "langchain-core>=0.3.0",
    "langchain-groq>=1.1.2",      # Optimized for Llama 3/4 on Groq

    # Safety & Guardrails
    "nemoguardrails[sdd]>=0.20.0", # Jan 2026 release with PII/Injection detection

    # Evaluation & Observability
    "deepeval>=3.0.0",            # 2026 version with component-level scoring
    "litellm>=1.0.0",             # For DeepEval LiteLLMModel (Groq backend)
    "pydantic>=2.10.0",           # Strict schema enforcement
    "pydantic-settings>=2.7.0",   # Environment management

    # Document Parsing
    "pymupdf>=1.25.0",            # High-performance PDF parsing
    "python-docx>=1.1.0",         # Word doc support

    # Utils
    "httpx>=0.28.0",              # Modern async HTTP client
    "requests>=2.32.0",           # GSheets bridge / sync calls
    "groq>=0.7.0",                # Groq API client (Llama on Groq)
    "rich>=13.9.0",               # Beautiful terminal logging
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "black>=25.0.0",
]

[tool.uv]
managed = true