# NeMo Guardrails: uses GROQ_API_KEY; input capped to MAX_NEMO_CHARS (default 6000) to save tokens.
# When LLM_PROVIDER=gemini, extractor/auditor use Gemini; NeMo still uses Groq here (set GROQ_API_KEY for NeMo).
colang_version: "2.x"
main_flow: main

models:
  - type: main
    engine: openai
    # Local Ollama model for NeMo guardrails (change here when deploying).
    model: qwen3.5:2b-q4_K_M
    api_key_env_var: GROQ_API_KEY
    parameters:
      openai_api_base: "http://localhost:11434/v1"

# Output rails disabled by default (saves one LLM call; extraction is schema-constrained).
# Set NEMO_OUTPUT_RAILS_ENABLED=true and add flow names under output.flows to enable.
rails:
  library:
    csl:
      - core
  # Enable built-in injection detection so "input security" flows can reject malicious inputs.
  config:
    injection_detection:
      injections:
        - code
        - sqli
        - template
        - xss
      action: reject
  output:
    flows: []
